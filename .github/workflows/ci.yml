name: CI

on:
  pull_request:
  push:
    branches: [main]

# read-only token; no secrets are used anywhere in this workflow
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # the child's game never uses generative AI, and CI never calls a paid service
  GAMBIT_RUNTIME_AI: '0'
  LLM_PROVIDER: template
  GAMBIT_CLIP_GEN: '0'

jobs:
  build:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # copies the Stockfish engine (with its licence) into apps/web/public/engine, then vite build
      - run: pnpm build

  e2e:
    name: End-to-end (Playwright, Chromium)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # belt and braces: playwright.config.ts already starts the dev stack with these, a temp DATA_DIR and empty keys
      CODEX_BIN: 'off'
      HIGGSFIELD_BIN: 'off'
      VOICE_OVERLAY_DIR: 'off'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      # `pnpm dev` on the default ports 5173 (web) and 8787 (API) — free on a fresh runner; the engine is copied by `dev`
      - name: Run e2e
        run: pnpm e2e --reporter=list,html

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
